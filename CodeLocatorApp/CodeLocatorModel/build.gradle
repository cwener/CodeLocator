apply plugin: 'java-library'

// Gradle 9 移除了 Project.getProperties(String)，改为标准的 hasProperty/property（Gradle 7 同样支持）
if (project.hasProperty("customUploadGradlePluginUrl")) {
    apply from: project.property("customUploadGradlePluginUrl")
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    api "com.google.code.gson:gson:2.8.5"
}

// Gradle 9 移除了 project.sourceCompatibility 这种老式赋值，改用 java {} 块（Gradle 7 同样支持）
java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

